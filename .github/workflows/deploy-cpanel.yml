name: Publicar Reportes en cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.php'
      - 'styles-reportes.css'
      - 'includes/**'
      - '.github/workflows/deploy-cpanel.yml'

permissions:
  contents: read

concurrency:
  group: deploy-reportes-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar y publicar Reportes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, curl, mbstring
          coverage: none

      - name: Validar sintaxis PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          find includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Publicar Reportes en ruta temporal
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?FTP_SERVER no configurado}"
          : "${FTP_USERNAME:?FTP_USERNAME no configurado}"
          : "${FTP_PASSWORD:?FTP_PASSWORD no configurado}"

          upload_file() {
            local local_file="$1"
            local remote_file="$2"
            local label="$3"
            local code=0

            for attempt in 1 2 3; do
              echo "FTPS ${label}: intento ${attempt}/3"
              if curl --fail --show-error --silent --ssl-reqd --insecure --ftp-pasv --disable-epsv \
                --connect-timeout 30 --max-time 75 --retry 2 --retry-delay 4 --retry-connrefused \
                --user "$FTP_USERNAME:$FTP_PASSWORD" --ftp-create-dirs \
                --upload-file "$local_file" "ftp://$FTP_SERVER:21/$remote_file"; then
                echo "FTPS ${label}: completado."
                return 0
              else
                code=$?
                echo "FTPS ${label}: fallo intento ${attempt} (curl ${code})."
              fi

              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 8)); fi
            done

            echo "ERROR: no fue posible publicar ${label}."
            return 1
          }

          upload_file index.php reportes-preview/index.php "index.php"
          upload_file styles-reportes.css reportes-preview/styles.css "styles.css"
          upload_file includes/reportes-sharepoint.php reportes-preview/includes/reportes-sharepoint.php "reportes-sharepoint.php"

          echo "Reportes publicado desde Meguesa/Reportes-JJP en /reportes-preview/."
